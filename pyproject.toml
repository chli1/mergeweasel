[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeweasel"
# The release tag vX.Y.Z is the version; the image carries it as the label
# org.opencontainers.image.version.
version = "0.0.0"
description = "A merge queue for Gitea: lands pull requests one at a time, only once they are tested."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[project.scripts]
mergeweasel = "mergeweasel.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
