[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeweasel"
# The release tag vX.Y.Z is the version; the image carries it as the label
# org.opencontainers.image.version.
version = "0.0.0"
description = "A merge queue for Gitea: lands pull requests one at a time, only once they are tested, and releases them."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[project.scripts]
mergeweasel = "mergeweasel.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
# The tests' subprocess calls read the return code themselves, or clean up whatever is left.
ignore = ["PLW1510"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["mergeweasel.settings.Settings"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# As pytest's pythonpath; explicit_package_bases keeps tests/unit and tests/integration's test_queue.py apart.
mypy_path = ["src", "tests/support"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# The forge's JSON is Any by design: api.py turns it into dataclasses, the tests' driver reads it as is.
module = ["mergeweasel.api", "driver"]
warn_return_any = false

[tool.pytest.ini_options]
# importlib: tests/unit and tests/integration both have a test_queue.py.
addopts = "--import-mode=importlib"
pythonpath = ["src", "tests/support"]
# The default run needs no Docker; CI names tests/integration and tests/e2e.
testpaths = ["tests/unit"]
markers = [
    "required_approvals(n): the repository's required approvals, 1 by default",
    "instance(branch, labels): the default branch and the automerge, needs-fix, keep-commits and prio labels' names, set as the passes' variables",
    "needs_new_image: the new workflow files need what the newest release's image lacks - [released] does not run until the newest release contains the commit that added this marker; a comment on its line names what",
    "breaks_old_workflows: the new image breaks the newest release's workflow files, a deliberate breaking change - [upgrade] does not run until the newest release contains the commit that added this marker; a comment on its line names what consumers change",
]
