name: ci
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-test.txt
          .venv/bin/python -m pytest
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: mergeweasel:ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the image
        run: docker build -t "$IMAGE" .
      # The event goes in on stdin: the job and the Docker daemon share no file system path.
      - name: The built image checks this pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          docker run --rm -i -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY -e GITHUB_TOKEN "$IMAGE"
          mergeweasel check-commits --event /dev/stdin < "$GITHUB_EVENT_PATH"
      # The run token only, never the queue token: a dry run that writes by mistake must fail.
      - name: The built image dry-runs a pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          docker run --rm -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY -e GITHUB_TOKEN "$IMAGE"
          mergeweasel pass --dry-run
      - name: Remove the image
        if: always()
        run: docker rmi -f "$IMAGE"
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MERGEWEASEL_E2E_IMAGE: mergeweasel:e2e-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # The variant markers look up their commit in the newest release's history.
        with:
          fetch-depth: 0
      - name: Build the image
        run: docker build -t "$MERGEWEASEL_E2E_IMAGE" .
      # The test starts its own Gitea and a runner next to it, runs passes of the built image and the
      # newest release against it, and lets the runner run the workflows. -rs: the log names each
      # skipped variant and why.
      - name: End-to-end test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-test.txt
          .venv/bin/python -m pytest -rs tests/integration tests/e2e
      # pytest removes its Gitea and its runner itself; this covers a pytest that died before its
      # cleanup.
      - name: Remove the containers and images
        if: always()
        run: |
          docker rm -f "mergeweasel-e2e-gitea-$GITHUB_RUN_ID" "mergeweasel-e2e-runner-$GITHUB_RUN_ID" || true
          for tag in "mergeweasel-e2e-gitea:$GITHUB_RUN_ID" "mergeweasel-e2e-runner:$GITHUB_RUN_ID"; do
            if docker image inspect "$tag" > /dev/null 2>&1; then docker rmi -f "$tag" || true; fi
          done
          docker rmi -f "$MERGEWEASEL_E2E_IMAGE" || true
      # The test pulls `latest` on every run, and each release leaves the previous one behind on the
      # daemon, so it keeps the newest `keep`.
      # Without -f: an image a concurrent run still uses stays.
      - name: Remove all but the newest release images
        if: always()
        run: |
          keep=5
          for id in $(docker image ls --all --quiet --filter label=org.opencontainers.image.title=mergeweasel \
              --filter label=org.opencontainers.image.version | sort -u); do
            docker image inspect --format \
              '{{index .Config.Labels "org.opencontainers.image.version"}} {{.Id}} {{json .RepoTags}}{{json .RepoDigests}}' "$id"
          done | grep '"chli1ro/mergeweasel[:@]' | sort -rV | tail -n "+$((keep + 1))" |
            while read -r version id references; do
              docker rmi "$id" || true
            done
  # No tests here: main takes only up-to-date pull requests whose checks passed.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: mergeweasel:release-${{ github.run_id }}
      REGISTRY_IMAGE: docker.io/chli1ro/mergeweasel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Only reviewed code is published, and `latest` stays the newest release on main.
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Read the version from the tag
        id: version
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "not a release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the image
        run: >-
          docker build -t "$IMAGE"
          --label org.opencontainers.image.version=${{ steps.version.outputs.version }}
          --label org.opencontainers.image.revision=$GITHUB_SHA
          --label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ) .
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login -u chli1ro --password-stdin
      # A Docker daemon can serve several jobs at once, so the registry names are shared: each exists
      # only around its own push, and the cleanup removes nothing but this run's image.
      # The digest pins the image in the templates. It is read through X.Y.Z, before that tag goes:
      # a parallel release may already have moved `latest` to its own image.
      - name: Push X.Y.Z and latest
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for tag in "$VERSION" latest; do
            docker tag "$IMAGE" "$REGISTRY_IMAGE:$tag"
            docker push "$REGISTRY_IMAGE:$tag"
            if [ "$tag" = "$VERSION" ]; then
              digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:$tag")
            fi
            docker rmi "$REGISTRY_IMAGE:$tag"
          done
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      # The release's templates: the workflow files as of this tag, pinned to the image just
      # pushed. Only the image line changes; a file without exactly one fails the release.
      - name: Render the workflow templates
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p templates
          for file in mergeweasel-commits.yml mergeweasel-queue.yml; do
            test -n "$DIGEST"
            test "$(grep -c "^ *image: $REGISTRY_IMAGE:" ".gitea/workflows/$file")" = 1
            sed "s|^\( *image: \)$REGISTRY_IMAGE:.*|\1$REGISTRY_IMAGE:$VERSION@$DIGEST|" \
              ".gitea/workflows/$file" > "templates/$file"
          done
      # Gitea keeps a second asset of the same name, so a re-run deletes the old one first.
      - name: Attach the templates to the release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          curl -fsS -H "Authorization: token $GITEA_TOKEN" "$api/releases/tags/$GITHUB_REF_NAME" > release.json
          release=$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')
          for file in mergeweasel-commits.yml mergeweasel-queue.yml; do
            for asset in $(python3 -c 'import json, sys; print(*[a["id"] for a in json.load(open("release.json"))["assets"] if a["name"] == sys.argv[1]])' "$file"); do
              curl -fsS -X DELETE -H "Authorization: token $GITEA_TOKEN" "$api/releases/$release/assets/$asset"
            done
            curl -fsS -X POST -H "Authorization: token $GITEA_TOKEN" -F "attachment=@templates/$file" \
              "$api/releases/$release/assets?name=$file" > /dev/null
          done
      # The same release on the GitHub mirror: the tag goes first, so the release finds it. Name, notes
      # and assets are Gitea's; a re-run reuses the release and replaces the assets. Without the token
      # there is no mirror, and the step does nothing.
      - name: Publish the release on GitHub
        env:
          MERGEWEASEL_GITHUB_SYNC_TOKEN: ${{ secrets.MERGEWEASEL_GITHUB_SYNC_TOKEN }}
        run: |
          if [ -z "$MERGEWEASEL_GITHUB_SYNC_TOKEN" ]; then
            echo "MERGEWEASEL_GITHUB_SYNC_TOKEN is not set: no GitHub release"
            exit 0
          fi
          git push "https://chli1:$MERGEWEASEL_GITHUB_SYNC_TOKEN@github.com/chli1/mergeweasel.git" \
            "refs/tags/$GITHUB_REF_NAME"
          api=https://api.github.com/repos/chli1/mergeweasel
          auth="Authorization: Bearer $MERGEWEASEL_GITHUB_SYNC_TOKEN"
          if ! curl -fsS -H "$auth" "$api/releases/tags/$GITHUB_REF_NAME" > github-release.json; then
            python3 -c 'import json, sys; r = json.load(open("release.json")); json.dump({"tag_name": r["tag_name"], "name": r["name"], "body": r["body"]}, sys.stdout)' |
              curl -fsS -X POST -H "$auth" --data-binary @- "$api/releases" > github-release.json
          fi
          release=$(python3 -c 'import json; print(json.load(open("github-release.json"))["id"])')
          for file in mergeweasel-commits.yml mergeweasel-queue.yml; do
            for asset in $(python3 -c 'import json, sys; print(*[a["id"] for a in json.load(open("github-release.json"))["assets"] if a["name"] == sys.argv[1]])' "$file"); do
              curl -fsS -X DELETE -H "$auth" "$api/releases/assets/$asset"
            done
            curl -fsS -X POST -H "$auth" -H "Content-Type: application/yaml" --data-binary "@templates/$file" \
              "https://uploads.github.com/repos/chli1/mergeweasel/releases/$release/assets?name=$file" > /dev/null
          done
      - name: Log out and remove the image
        if: always()
        run: |
          docker logout || true
          docker rmi -f "$IMAGE" || true
