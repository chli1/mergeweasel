name: ci-cleanup
on:
  # Every finished run of ci, a cancelled one included: the runner skips a cancelled run's
  # remaining steps, `if: always()` ones as well, so ci cleans up nothing itself.
  workflow_run:
    workflows: [ci]
    types: [completed]
jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      # The containers and images ci and the Docker layers name after the run id - mergeweasel:ci-<id>,
      # mergeweasel-e2e-gitea-<id>-<job> and the like; the daemon serves other runs at the same time,
      # so nothing but this run's. The job containers and volumes of the test's runner carry no run
      # id: the next end-to-end test removes those older than an hour.
      - name: Remove the run's containers and images
        run: |
          test -n "$RUN_ID"
          echo "ci run $RUN_ID"
          for container in $(docker ps --all --quiet --filter "name=^mergeweasel-e2e-(gitea|runner)-$RUN_ID-"); do
            docker rm -f "$container" || true
          done
          for reference in "mergeweasel:*-$RUN_ID" "mergeweasel:*-$RUN_ID-*" "mergeweasel-e2e-*:$RUN_ID-*"; do
            for tag in $(docker images --format '{{.Repository}}:{{.Tag}}' --filter "reference=$reference"); do
              docker rmi -f "$tag" || true
            done
          done
