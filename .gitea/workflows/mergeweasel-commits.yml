name: mergeweasel-commits
# Its own workflow: editing a pull request's title or body re-runs only this check.
on:
  pull_request:
    branches: [main]
    # edited: the title and the ## Commit section are the squash commit; labeled/unlabeled:
    # keep-commits switches what is checked, and every label change wakes the queue through this
    # run's completion - narrowing them leaves automerge and needs-fix changes unnoticed.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: docker.io/chli1ro/mergeweasel:1.0.0
    steps:
      - name: Check what lands on main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mergeweasel check-commits --event "$GITHUB_EVENT_PATH"
